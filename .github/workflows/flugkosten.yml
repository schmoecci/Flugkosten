name: Tägliche Flugpreis Analyse

on:
  schedule:
    # Läuft jeden Tag um 05:00 Uhr UTC (ca. 07:00 Uhr deutscher Sommerzeit)
    - cron: '0 5 * * *'
  workflow_dispatch: # Erlaubt es dir, das Skript jederzeit manuell auf GitHub per Klick zu starten

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/numeric-versioning@v3 # Nutzt stabiles Python
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install google-search-results

      - name: Skript ausführen
        run: python start.py

      - name: CSV-Änderungen sichern
        run: |
          git config --local user.email "msberlin87@gmail.com"
          git config --local user.name "schmoecci"
          git add *.csv
          git commit -m "data: Flugpreise aktualisiert [skip ci]" || echo "Keine Änderungen"
          git push